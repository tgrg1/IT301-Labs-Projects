<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 6 - Flex box</title>
    <style>
        body, html {
            margin: 0;
        }
        #flex-parent {
            height: 100vh;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-evenly;
        }
    </style>
</head>
<body>
    <div id="flex-parent">
        <img src="https://picsum.photos/384/384?random=1" alt="Random image 1" id="image1">
        <img src="https://picsum.photos/512/512?random=2" alt="Random image 2" id="image2">
        <img src="https://picsum.photos/384/384?random=3" alt="Random image 3" id="image3">
    </div>
</body>
</html>
