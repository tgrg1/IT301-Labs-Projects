<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 12 - Greeting and Calculator</title>
</head>
<body>
    <form action="#">
        <label for="name">What is your name? </label>
        <input type="text" id="name" /><br><br>
        <button id="submit-name" type="button">Submit</button>
    </form>

    <p id="greeting"></p>

    <h1>Calculator</h1>
    <form action="#">
        <label for="num1">First number</label><br>
        <input type="number" id="num1"><br>
        <label for="num2">Second number</label><br>
        <input type="number" id="num2"><br><br>

        <input type="radio" name="calc" value="add" id="add"><label for="add">Add &plus;</label>
        <input type="radio" name="calc" value="sub" id="sub"><label for="sub">Subtract &minus;</label>
        <input type="radio" name="calc" value="mul" id="mul"><label for="mul">Multiply &times;</label>
        <input type="radio" name="calc" value="div" id="div"><label for="div">Divide &divide;</label><br><br>

        <button id="calculate" type="button">Calculate</button>
        <button id="clear" type="button">Clear</button>
    </form>
    <h2><u>Result</u></h2>
    <p id="result"></p>

    <script>
        const name = document.getElementById('name');
        const greeting = document.getElementById('greeting');
        const num1 = document.getElementById('num1');
        const num2 = document.getElementById('num2');
        const result = document.getElementById('result');

        function calculation(func, x, y) {
            if (func === "add"){
                return x + y
            } else if (func === "sub") {
                return x - y
            } else if (func === "mul") {
                return x * y
            } else if (func === "div") {
                return x / y
            }
        };

        document.getElementById('submit-name').addEventListener('click', function(){
            greeting.textContent = `Welcome, ${name.value}.`;
        });

        document.getElementById('calculate').addEventListener('click', function(){
            const math_function = document.querySelector('[name = calc]:checked');

            result.textContent = calculation(math_function.value, Number(num1.value), Number(num2.value));
        });

        document.getElementById('clear').addEventListener('click', function(){
            name.value = ''
            greeting.textContent = ''
            result.textContent = ''
            num1.value = ''
            num2.value = ''
            document.querySelector('[name = calc]:checked').checked = false;
        });
    </script>
</body>
</html>
